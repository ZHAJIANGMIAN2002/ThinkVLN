model:
  model_name_or_path: "/mnt/swx/ThinkVLN/model_weights/qwen3vl-8"
  use_flash_attention_2: true
  use_lora: true
  lora_r: 32
  lora_alpha: 64
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  freeze_vision_tower: true
  freeze_llm: false

data:
  bundle_root: "/mnt/swx/ThinkVLN"
  manifest_file: "/mnt/swx/ThinkVLN/results/watcher_rollout_train_merged_fullv2_streamv2/manifest/watcher_rollout_manifest.jsonl"
  annotation_file: "/mnt/swx/ThinkVLN/results/watcher_rollout_train_merged_fullv2_streamv2/watcher_openai_annotations.deploy.full.jsonl"
  summary_full_path: "/mnt/swx/ThinkVLN/data/trajectory_data/R2R_back/summary_full.jsonl"
  image_stride: 3
  val_split_ratio: 0.02
  sample_ratio: 1.0

training:
  output_dir: "outputs/watcher/lora/qwen3vl8-fullv2-streamv2"
  num_train_epochs: 1
  max_steps: -1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_steps: 200
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  bf16: true
  fp16: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  logging_steps: 10
  logging_first_step: true
  save_steps: 1000
  save_total_limit: 3
  eval_strategy: "steps"
  eval_steps: 1000
  deepspeed: null
  dataloader_num_workers: 0
  dataloader_pin_memory: true
  seed: 42
  ddp_find_unused_parameters: false
  ddp_backend: "nccl"

logging:
  report_to: [wandb]
  project: "thinkvln"
  run_name: "watcher-sft-qwen3vl8-fullv2-streamv2"
  logging_dir: "logs/watcher_sft_fullv2_streamv2"
