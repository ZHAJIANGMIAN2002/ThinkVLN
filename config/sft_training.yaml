# ThinkVLN Actor SFT Training Configuration
# 
# This configuration file provides a template for training the ThinkVLN actor model
# using supervised fine-tuning with mixed action and CoT data.
#
# Usage:
#   The trainer accepts command-line arguments. This file serves as a reference
#   for the available options and recommended settings.

# ============================================================================
# Model Configuration
# ============================================================================
model:
  # Pretrained Qwen3VL model path or HuggingFace model identifier
  model_name_or_path: "/mnt/swx/ThinkVLN/model_weights/qwen3vl-2"
  
  # Number of learnable query tokens for action/progress prediction
  # These tokens are appended to the input sequence for action mode
  num_query_tokens: 4
  
  # Number of discrete action classes
  # 0: stop, 1: forward, 2: turn_left, 3: turn_right
  num_action_classes: 4
  
  # Loss weights for multi-task learning
  action_loss_weight: 0.1     # Weight for action classification loss
  progress_loss_weight: 1.0    # Weight for progress regression loss
  use_huber_loss_for_progress: true  # Use Huber (SmoothL1) instead of MSE for progress, more robust to outliers

  # LoRA configuration for parameter-efficient fine-tuning
  use_lora: false               # Enable LoRA adapters
  lora_r: 32                    # LoRA rank (4, 8, 16, 32)
  lora_alpha: 64               # LoRA scaling factor (usually 2*r)
  lora_dropout: 0.05           # Dropout for LoRA layers
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  
  # Model freezing configuration
  freeze_vision_tower: true    # Freeze vision encoder to save memory
  freeze_llm: false            # Freeze language model (only train actor heads and query embeddings)
  
  # Query token IDs (optional, defaults: action=151700, progress=151701)
  # action_query_token_id: 151700
  # progress_query_token_id: 151701
  
  # Attention optimization
  use_flash_attention_2: true  # Use FlashAttention-2 for faster and more memory-efficient attention


# ============================================================================
# Data Configuration
# ============================================================================
data:
  # Root directory for images
  image_root: "data/trajectory_data/R2R_back/r2r"

  # Path to action prediction data (JSONL, relative to data_root)
  action_data_path: "/mnt/swx/ThinkVLN/data/trajectory_data/R2R_back/summary_full.jsonl"
  # Path to Chain-of-Thought (CoT) data (JSONL, relative to data_root)
  # cot_data_path: "/mnt/swx/ThinkVLN/data/cot_dataset/cot_dataset_answer.jsonl"
  cot_data_path: null
  
  # Sample ratio: proportion of full dataset to use (1.0 = all, 0.1 = 10%)
  # Val split is applied after subsampling
  sample_ratio: 1
  # Validation split ratio (applied to subsampled data)
  # 0.1 means 10% for validation. Set to 0 to disable
  val_split_ratio: 0.05


# ============================================================================
# Training Configuration
# ============================================================================
training:
  # Output directory for checkpoints and logs
  output_dir: "outputs/actor/full/run-3-2-seperate-2"
  
  # Resume from checkpoint (optional)
  # Set to checkpoint directory path to resume training
  # Example: "outputs/thinkvln_actor/checkpoint-1000"
  # Leave as null or comment out to start fresh training
  resume_from_checkpoint: null
  
  # Training duration
  num_train_epochs: 1
  max_steps: -1  # -1 means use num_train_epochs instead
  
  # Batch size and gradient accumulation
  per_device_train_batch_size: 8      # Batch size per GPU (increased with LoRA)
  gradient_accumulation_steps: 1      # 8卡分片后先降到1，避免每个epoch只有很少更新步
  # Effective batch size = per_device_batch_size × gradient_accumulation_steps × num_gpus
  # Example: 2 × 4 × 8 = 64 (for 8 GPUs)
  
  # Optimizer settings
  learning_rate: 1.0e-5
  weight_decay: 0.01
  warmup_steps: 70
  max_grad_norm: 1.0
  
  # Learning rate scheduler
  lr_scheduler_type: "cosine"
  
  # Mixed precision training
  bf16: true          # Use bfloat16 (recommended for A100/H100)
  fp16: false         # Use float16 (for V100)
  
  # Memory optimization
  gradient_checkpointing: true  # Enable to save memory
  
  # Logging and checkpointing
  logging_steps: 10
  logging_first_step: true
  save_steps: 1000
  save_total_limit: 3           # Keep only last 3 checkpoints
  
  # Evaluation (if eval dataset is provided)
  eval_strategy: "steps"  # "no", "steps", or "epoch"
  eval_steps: 1000
  per_device_eval_batch_size: 16  # Batch size per GPU for evaluation
  eval_accumulation_steps: 1    # Number of batches to accumulate before moving to CPU
  
  # Distributed training
  # For DeepSpeed ZeRO-2 or ZeRO-3
  deepspeed: "config/zero2.json"
  
  # Data loading
  dataloader_num_workers: 4
  dataloader_pin_memory: true
  
  # Reproducibility
  seed: 42
  
  # Distributed training settings
  ddp_find_unused_parameters: false   # 当前 cot_data_path=null（action-only）可关掉以减少DDP开销
  ddp_backend: "nccl"                # Use "nccl" for NVIDIA GPUs, "gloo" for CPU

  # Custom evaluation metrics
  # Configure which metrics to compute during evaluation
  custom_eval_metrics:
    # For progress prediction: use L1 loss instead of default loss
    progress_metric: "l1"  # Options: "l1", "mse", "huber"
    # For action classification: compute accuracy
    action_metric: "accuracy"  # Options: "accuracy", "loss"


# ============================================================================
# Logging Configuration (WandB)
# ============================================================================
logging:
  # Logging destinations: ["wandb", "tensorboard", "none"]
  # Multiple can be specified, e.g., ["wandb", "tensorboard"]
  report_to: ["wandb"]
  
  # WandB run name (optional, auto-generated if not specified)
  # Use a descriptive name to identify your runs
  run_name: "thinkvln-actor-sft"
  
  # Logging directory for local logs (optional)
  # If not specified, will use output_dir/runs
  logging_dir: null


# ============================================================================
# Usage
# ============================================================================
# 
# Run training using this configuration file:
#
#   python thinkvln/engine/sft_trainer.py --config config/sft_training.yaml
#
# To use a custom configuration:
#
#   python thinkvln/engine/sft_trainer.py --config path/to/your_config.yaml
#
# To override specific settings, edit this file or create a new config file.
# All settings above can be modified to suit your training requirements.


# ============================================================================
# Hardware Recommendations
# ============================================================================
#
# With LoRA + Frozen Vision Tower + FlashAttention-2 (recommended, 60-70% memory reduction):
# For 8x A100 (80GB):
#   - per_device_train_batch_size: 8
#   - gradient_accumulation_steps: 2
#   - bf16: true
#   - use_lora: true, lora_r: 16
#   - use_flash_attention_2: true
#
# For 8x V100 (32GB):
#   - per_device_train_batch_size: 4
#   - gradient_accumulation_steps: 4
#   - fp16: true (FlashAttention-2 requires Ampere+ for best performance)
#   - use_lora: true, lora_r: 8
#   - gradient_checkpointing: true
#
# For 8x RTX 3090/4090 (24GB):
#   - per_device_train_batch_size: 2
#   - gradient_accumulation_steps: 8
#   - bf16: true (if supported)
#   - use_lora: true, lora_r: 8
#   - use_flash_attention_2: true
#   - gradient_checkpointing: true
#
# Without LoRA (full fine-tuning, higher memory):
# For 8x A100 (80GB):
#   - per_device_train_batch_size: 4
#   - gradient_accumulation_steps: 4
#   - freeze_vision_tower: true (recommended)
#
# For 8x V100 (32GB):
#   - per_device_train_batch_size: 2
#   - gradient_accumulation_steps: 8
#   - gradient_checkpointing: true
#   - freeze_vision_tower: true
#   - deepspeed: scripts/zero3.json


# ============================================================================
# Notes
# ============================================================================
#
# 1. Data Format:
#    - Action data must be in JSONL format with fields: episode_key, actions, 
#      subtask_sequence, instruction, plan
#    - CoT data must be in JSONL format with fields: frame_key, episode_key,
#      instruction, plan, answer (reasoning text)
#
# 2. Mixed Batch Training:
#    - The trainer automatically handles mixed batches of action and CoT samples
#    - Action samples get query tokens appended and compute action/progress loss
#    - CoT samples generate reasoning and compute language modeling loss
#
# 3. Dataset Implementation:
#    - The dataset/collator API is defined in thinkvln/dataset/dataset.py
#    - Full implementation needs to be completed before training
#    - See the API documentation in dataset.py for expected formats
#
# 4. Train/Val Split:
#    - Set val_split_ratio > 0 to enable validation
#    - Validation metrics will be logged to WandB
#    - Best model will be saved based on validation loss
#
# 5. FlashAttention-2 Installation (if not already installed):
#    - pip install flash-attn --no-build-isolation
#    - Requires CUDA 11.6+ and Ampere+ GPU (A100, RTX 3090/4090, etc.)
#    - Provides 2-3x speedup and 30% memory reduction for attention
#
# 6. Memory Optimization Summary:
#    - LoRA (r=8): Reduces trainable params by 99.6% (8.7M vs 2.1B)
#    - Frozen Vision Tower: Saves ~40% of gradient memory
#    - FlashAttention-2: Saves ~30% attention memory, 2-3x faster
#    - Gradient Checkpointing: Trades compute for memory (25% slower, 50% less memory)
#    - Combined: ~70% total memory reduction with 10-15% training speedup
